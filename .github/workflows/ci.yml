name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://smartdine:ci_password@localhost:5432/smartdine?schema=public
  JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  SEED_DEMO_PASSWORD: Demo-Passw0rd-2026

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartdine
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: smartdine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartdine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate -w @smartdine/api
      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy
        working-directory: apps/api
      - name: Check the migrations match schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        working-directory: apps/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Critical advisories in shipped dependencies fail the build. The known high-severity
      # deepmerge-ts advisory (Prisma 6 CLI, migrations only) is an accepted risk: docs/security.md.
      - run: npm audit --omit=dev --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartdine
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: smartdine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartdine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @smartdine/api
      - name: Migrate and seed
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
        working-directory: apps/api
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run end-to-end tests
        run: npm run test:e2e -w @smartdine/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t smartdine-api .
      - run: docker build -f docker/web.Dockerfile -t smartdine-web .
      - name: Smoke-test the stack
        env:
          POSTGRES_PASSWORD: ci_password
          JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          COOKIE_SECURE: "false"
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/v2/health && break
            sleep 3
          done
          curl -fsS http://localhost:8080/api/v2/health
          curl -fsSI http://localhost:8080/ | grep -i "content-security-policy"
          docker compose down -v
