# Included in every location: nginx drops server-level add_header lines in a location that sets its own.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# The one inline script (theme flash guard in index.html) is allowed by hash; the web test
# `csp.test.ts` fails if the script changes without this hash being updated.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-id/RlQ8CI779vkehxMM4IcxeUj0qZAkaeBvqvdqtjmc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# HSTS belongs on the TLS-terminating proxy in front of this container; see docs/deployment.md.
